// Top-level build file for the iOS project Quorum Studio makes in Run/Mobile.
// Studio copies this file and gradle.properties into existing Mobile folders
// when they differ (IOSSupport:UpdateGradleSettings).

buildscript {
    project.ext.mobivmVersion = "2.3.20"
    project.ext.mobivmLocation = "com.mobidevelop.robovm"

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "$mobivmLocation:robovm-gradle-plugin:$mobivmVersion"
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

project(":ios") {
    apply plugin: 'java'
    apply plugin: 'robovm'
    apply plugin: 'java-library'

    dependencies {
        implementation "$mobivmLocation:robovm-rt:$mobivmVersion"
        implementation "$mobivmLocation:robovm-cocoatouch:$mobivmVersion"
    }
}
