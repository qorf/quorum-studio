plugins {
    id 'com.android.application'
}

android {
    // The package of the generated R class, which MainActivity imports.
    namespace = 'com.quorum.TestApplication'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.quorum.testapplication'
        // Android 14: Quorum's minimum. Vulkan 1.3 is used where the device
        // has it (Game:StartGame), and OpenGL ES everywhere else.
        minSdk = 34
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        // The natives are built by quorum-natives' AutoBuild for these ABIs,
        // and copied into src/main/jniLibs by Quorum Studio.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation files('libs/Default.jar') // The program's jar: Quorum Studio writes its name on this line.
    implementation files('libs/QuorumStandardLibrary.jar')
    implementation files('libs/QuorumStandardPlugins.jar')
}
