# Project-wide Gradle settings for the Android project Quorum Studio makes.
# Quorum Studio adds org.gradle.java.home below when a JDK is chosen for it
# (Gradle 9 and the Android Gradle plugin need a JDK 17 or later).

# Dexing the standard library's jars needs more memory than Gradle's default.
org.gradle.jvmargs=-Xmx4g
